[package]
name = "jmespath-python"
version = "0.5.0"
authors = ["Josh Rotenberg <joshrotenberg@gmail.com>"]
license = "MIT"
edition = "2024"
description = "Python bindings for jmespath.rs"
repository = "https://github.com/jmespath/jmespath.rs"
publish = false

[lib]
name = "jmespath_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
jmespath = { path = "../jmespath", version = "0.5.0", features = ["sync"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
serde_json = "1.0"

[build-dependencies]
pyo3-build-config = "0.23"
